<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#f2f0e9;--ink:#171714;--muted:#706f68;--line:#cbc9c0;--blue:#4058ea;
        --display:"Manrope",Arial,sans-serif;--mono:"DM Mono",monospace}
  *{box-sizing:border-box}
  html,body{width:1200px;height:630px;margin:0;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--display);
       display:flex;flex-direction:column;padding:56px 64px;-webkit-font-smoothing:antialiased}
  header{display:flex;justify-content:space-between;align-items:center;
         padding-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:700;
         text-transform:uppercase;letter-spacing:.02em}
  .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
        background:var(--ink);color:var(--paper);font-size:15px;font-weight:700}
  .role{color:var(--muted);font:500 14px var(--mono);text-transform:uppercase;letter-spacing:.07em}
  main{flex:1;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{margin:0 0 14px;color:var(--muted);font:500 14px var(--mono);
           text-transform:uppercase;letter-spacing:.08em}
  h1{margin:0;font-size:92px;line-height:.9;font-weight:500;letter-spacing:-.06em}
  h1 span{color:var(--blue)}
  footer{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
         padding-top:24px;border-top:1px solid var(--line)}
  footer div{display:flex;flex-direction:column;gap:4px}
  footer strong{font-size:38px;font-weight:500;letter-spacing:-.05em}
  footer span{color:var(--muted);font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">DD</span><span>Dennis Dizon</span></div>
    <div class="role">FileMaker Developer / IT Specialist</div>
  </header>
  <main>
    <p class="eyebrow">Butuan City, Philippines · 7+ years building custom applications</p>
    <h1>Business systems,<br /><span>without the friction.</span></h1>
  </main>
  <footer>
    <div><strong>40%</strong><span>Less manual entry</span></div>
    <div><strong>30%</strong><span>Faster processing</span></div>
    <div><strong>99%</strong><span>Uptime</span></div>
    <div><strong>10+</strong><span>Years in IT</span></div>
  </footer>
</body>
</html>
